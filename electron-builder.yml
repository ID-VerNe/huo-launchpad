# For all available options see https://www.electron.build/configuration/configuration

appId: com.huochat.launcher
productName: HuoChat Launcher

directories:
  output: dist
  buildResources: resources

files:
  - from: .
    filter:
      - package.json
      - out/**/*
  - from: resources/bin
    to: bin
    filter:
      - "**/*"

asarUnpack:
  - resources/**

win:
  executableName: huochat
  artifactName: ${name}-${version}-setup.${ext}
  requestedExecutionLevel: requireAdministrator
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

mac:
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg

linux:
  target:
    - AppImage
